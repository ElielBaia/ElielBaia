name: Build BABEL Android APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'babel-ci/**'
      - '.github/workflows/babel-android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Assemble auditable Java source
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=babel-ci/project
          mkdir -p "$PROJECT/app/src/main/java/com/forsetigames/babel"
          cat "$PROJECT"/gameview-parts/*.java.part > "$PROJECT/app/src/main/java/com/forsetigames/babel/GameView.java"
          test -s "$PROJECT/app/src/main/java/com/forsetigames/babel/GameView.java"
          test -s "$PROJECT/app/src/main/java/com/forsetigames/babel/MainActivity.java"
          test -s "$PROJECT/app/src/main/java/com/forsetigames/babel/PhysicsWorld.java"
          test -s "$PROJECT/app/src/main/java/com/forsetigames/babel/StructuralSolver.java"
          echo "Java source inventory:"
          find "$PROJECT/app/src/main/java" -name '*.java' -type f -printf '%p %s bytes\n' | sort
          echo "GameView lines: $(wc -l < "$PROJECT/app/src/main/java/com/forsetigames/babel/GameView.java")"
      - name: Generate original textures and sounds
        working-directory: babel-ci/project
        run: python3 tools/generate_assets.py
      - name: Clean build native Android APK without cache
        working-directory: babel-ci/project
        run: gradle --no-daemon --no-build-cache --rerun-tasks --stacktrace clean :app:assembleDebug
      - name: Verify compiled game classes exist before DEX validation
        working-directory: babel-ci/project
        shell: bash
        run: |
          set -euo pipefail
          echo "Compiled class inventory:"
          find app/build/intermediates/javac -type f -name '*.class' -printf '%p %s bytes\n' | sort | tee compiled-classes.txt
          for cls in MainActivity GameView PhysicsWorld StructuralSolver SaveData DifficultyDirector Block MaterialSpec MaterialType SupportContact; do
            if ! find app/build/intermediates/javac -type f -name "$cls.class" -print -quit | grep -q .; then
              echo "FATAL: $cls.class was not produced by javac" >&2
              exit 31
            fi
          done
      - name: Validate APK, DEX game classes, package and signature
        working-directory: babel-ci/project
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          rm -rf apk-inspect && mkdir apk-inspect
          unzip -q "$APK" 'classes*.dex' -d apk-inspect
          echo "DEX files:"
          ls -lh apk-inspect/classes*.dex
          for cls in MainActivity GameView PhysicsWorld StructuralSolver SaveData DifficultyDirector Block MaterialSpec MaterialType SupportContact; do
            if ! "$ANDROID_HOME/build-tools/35.0.1/dexdump" apk-inspect/classes*.dex | grep -Fq "Lcom/forsetigames/babel/$cls;"; then
              echo "FATAL: $cls is absent from final DEX" >&2
              exit 32
            fi
          done
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK" | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          unzip -t "$APK" | tee apk-zip-test.txt
          sha256sum "$APK" | tee apk-sha256.txt
          stat -c '%n %s bytes' "$APK" | tee apk-size.txt
          cp "$APK" BABEL-The-Weight-of-Heaven-debug.apk
      - name: Install, launch and interact with BABEL on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            cd babel-ci/project
            APK=app/build/outputs/apk/debug/app-debug.apk

            adb install -r "$APK" 2>&1 | tee emulator-install.txt
            grep -Fq 'Success' emulator-install.txt

            adb logcat -c
            adb shell am force-stop com.forsetigames.babel
            adb shell am start -W -n com.forsetigames.babel/.MainActivity 2>&1 | tee emulator-launch.txt
            sleep 3

            PID1=$(adb shell pidof com.forsetigames.babel | tr -d '\r')
            test -n "$PID1"
            echo "BABEL menu process alive: $PID1" | tee emulator-process.txt
            adb shell dumpsys activity activities > emulator-activity.txt
            grep -F 'com.forsetigames.babel' emulator-activity.txt | head -n 12 > emulator-activity-babel.txt || true
            adb exec-out screencap -p > emulator-home.png
            test -s emulator-home.png

            # Enter gameplay and actually release one construction element.
            adb shell input tap 540 710
            sleep 2
            PID2=$(adb shell pidof com.forsetigames.babel | tr -d '\r')
            test -n "$PID2"
            adb exec-out screencap -p > emulator-game-start.png
            test -s emulator-game-start.png
            adb shell input swipe 540 225 650 225 350
            sleep 3
            PID3=$(adb shell pidof com.forsetigames.babel | tr -d '\r')
            test -n "$PID3"
            echo "BABEL gameplay process alive: $PID3" | tee -a emulator-process.txt
            adb exec-out screencap -p > emulator-gameplay.png
            test -s emulator-gameplay.png

            adb logcat -d > emulator-logcat.txt
            if grep -Fq 'Process: com.forsetigames.babel' emulator-logcat.txt && grep -Fq 'FATAL EXCEPTION' emulator-logcat.txt; then
              echo 'FATAL runtime exception detected for BABEL' >&2
              exit 33
            fi
            echo 'INSTALL=PASS' > emulator-status.txt
            echo 'MENU_LAUNCH=PASS' >> emulator-status.txt
            echo 'GAMEPLAY_INTERACTION=PASS' >> emulator-status.txt
            echo "PID=$PID3" >> emulator-status.txt
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BABEL-Emulator-Diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            babel-ci/project/emulator-install.txt
            babel-ci/project/emulator-launch.txt
            babel-ci/project/emulator-process.txt
            babel-ci/project/emulator-activity.txt
            babel-ci/project/emulator-activity-babel.txt
            babel-ci/project/emulator-logcat.txt
            babel-ci/project/emulator-status.txt
            babel-ci/project/emulator-home.png
            babel-ci/project/emulator-game-start.png
            babel-ci/project/emulator-gameplay.png
      - name: Package auditable source snapshot
        working-directory: babel-ci/project
        run: zip -qr BABEL-Android-Source.zip . -x '.gradle/*' 'app/build/*' 'apk-inspect/*'
      - uses: actions/upload-artifact@v4
        with:
          name: BABEL-Android-APK
          if-no-files-found: error
          retention-days: 7
          path: |
            babel-ci/project/BABEL-The-Weight-of-Heaven-debug.apk
            babel-ci/project/BABEL-Android-Source.zip
            babel-ci/project/apk-badging.txt
            babel-ci/project/apk-signature.txt
            babel-ci/project/apk-zip-test.txt
            babel-ci/project/apk-sha256.txt
            babel-ci/project/apk-size.txt
            babel-ci/project/compiled-classes.txt
            babel-ci/project/emulator-install.txt
            babel-ci/project/emulator-launch.txt
            babel-ci/project/emulator-process.txt
            babel-ci/project/emulator-activity-babel.txt
            babel-ci/project/emulator-status.txt
            babel-ci/project/emulator-home.png
            babel-ci/project/emulator-game-start.png
            babel-ci/project/emulator-gameplay.png
