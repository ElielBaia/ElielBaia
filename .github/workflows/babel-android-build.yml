name: Build BABEL Android APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'babel-ci/**'
      - '.github/workflows/babel-android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1' 'emulator' 'system-images;android-28;default;x86_64'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Assemble auditable Java source
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=babel-ci/project
          mkdir -p "$PROJECT/app/src/main/java/com/forsetigames/babel"
          cat "$PROJECT"/gameview-parts/*.java.part > "$PROJECT/app/src/main/java/com/forsetigames/babel/GameView.java"
          test -s "$PROJECT/app/src/main/java/com/forsetigames/babel/GameView.java"
          test -s "$PROJECT/app/src/main/java/com/forsetigames/babel/MainActivity.java"
          test -s "$PROJECT/app/src/main/java/com/forsetigames/babel/PhysicsWorld.java"
          test -s "$PROJECT/app/src/main/java/com/forsetigames/babel/StructuralSolver.java"
          find "$PROJECT/app/src/main/java" -name '*.java' -type f -printf '%p %s bytes\n' | sort
          echo "GameView lines: $(wc -l < "$PROJECT/app/src/main/java/com/forsetigames/babel/GameView.java")"
      - name: Generate original textures and sounds
        working-directory: babel-ci/project
        run: python3 tools/generate_assets.py
      - name: Clean build native Android APK without cache
        working-directory: babel-ci/project
        run: gradle --no-daemon --no-build-cache --rerun-tasks --stacktrace clean :app:assembleDebug
      - name: Verify compiled game classes exist before DEX validation
        working-directory: babel-ci/project
        shell: bash
        run: |
          set -euo pipefail
          find app/build/intermediates/javac -type f -name '*.class' -printf '%p %s bytes\n' | sort | tee compiled-classes.txt
          for cls in MainActivity GameView PhysicsWorld StructuralSolver SaveData DifficultyDirector Block MaterialSpec MaterialType SupportContact; do
            find app/build/intermediates/javac -type f -name "$cls.class" -print -quit | grep -q . || { echo "FATAL: $cls.class absent" >&2; exit 31; }
          done
      - name: Validate APK, DEX game classes, package and signature
        working-directory: babel-ci/project
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          rm -rf apk-inspect && mkdir apk-inspect
          unzip -q "$APK" 'classes*.dex' -d apk-inspect
          ls -lh apk-inspect/classes*.dex
          for cls in MainActivity GameView PhysicsWorld StructuralSolver SaveData DifficultyDirector Block MaterialSpec MaterialType SupportContact; do
            "$ANDROID_HOME/build-tools/35.0.1/dexdump" apk-inspect/classes*.dex | grep -Fq "Lcom/forsetigames/babel/$cls;" || { echo "FATAL: $cls absent from DEX" >&2; exit 32; }
          done
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK" | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          unzip -t "$APK" | tee apk-zip-test.txt
          sha256sum "$APK" | tee apk-sha256.txt
          stat -c '%n %s bytes' "$APK" | tee apk-size.txt
          cp "$APK" BABEL-The-Weight-of-Heaven-debug.apk
      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; ls -l /dev/kvm; fi
      - name: Boot Android emulator manually and test BABEL gameplay
        working-directory: babel-ci/project
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$PWD/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          : > emulator-boot.txt
          echo no | avdmanager create avd -n babel_test -k 'system-images;android-28;default;x86_64' -p "$ANDROID_AVD_HOME/babel_test.avd" -d pixel_2 --force 2>&1 | tee emulator-avd-create.txt
          echo 'AVD inventory:' | tee emulator-avd-list.txt
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee -a emulator-avd-list.txt
          test -f "$ANDROID_AVD_HOME/babel_test.ini"
          test -d "$ANDROID_AVD_HOME/babel_test.avd"
          "$ANDROID_HOME/emulator/emulator" -avd babel_test -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none > emulator-boot.txt 2>&1 &
          EMU_PID=$!
          trap 'adb emu kill >/dev/null 2>&1 || true; kill "$EMU_PID" >/dev/null 2>&1 || true' EXIT

          BOOTED=0
          for i in $(seq 1 120); do
            if adb devices 2>/dev/null | grep -q '^emulator-'; then
              COMPLETE=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$COMPLETE" = "1" ]; then BOOTED=1; break; fi
            fi
            if ! kill -0 "$EMU_PID" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$BOOTED" != "1" ]; then
            echo 'FATAL: emulator did not finish booting' >&2
            tail -n 240 emulator-boot.txt >&2 || true
            exit 41
          fi
          echo 'EMULATOR_BOOT=PASS' > emulator-status.txt
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb shell wm size 1080x1920 || true
          adb shell input keyevent 82 || true

          APK=app/build/outputs/apk/debug/app-debug.apk
          adb install -r "$APK" 2>&1 | tee emulator-install.txt
          grep -Fq 'Success' emulator-install.txt
          echo 'INSTALL=PASS' >> emulator-status.txt

          adb logcat -c
          adb shell am force-stop com.forsetigames.babel
          adb shell am start -W -n com.forsetigames.babel/.MainActivity 2>&1 | tee emulator-launch.txt
          sleep 4
          PID1=$(adb shell pidof com.forsetigames.babel | tr -d '\r')
          test -n "$PID1"
          echo "MENU_LAUNCH=PASS PID=$PID1" >> emulator-status.txt
          adb shell dumpsys activity activities > emulator-activity.txt
          grep -F 'com.forsetigames.babel' emulator-activity.txt | head -n 20 > emulator-activity-babel.txt || true
          adb exec-out screencap -p > emulator-home.png
          test -s emulator-home.png

          adb shell input tap 540 700
          sleep 3
          PID2=$(adb shell pidof com.forsetigames.babel | tr -d '\r')
          test -n "$PID2"
          adb exec-out screencap -p > emulator-game-start.png
          test -s emulator-game-start.png

          adb shell input swipe 540 260 670 260 500
          sleep 5
          PID3=$(adb shell pidof com.forsetigames.babel | tr -d '\r')
          test -n "$PID3"
          adb exec-out screencap -p > emulator-gameplay.png
          test -s emulator-gameplay.png
          echo "GAMEPLAY_INTERACTION=PASS PID=$PID3" >> emulator-status.txt

          adb logcat -d > emulator-logcat.txt
          if grep -Fq 'Process: com.forsetigames.babel' emulator-logcat.txt && grep -Fq 'FATAL EXCEPTION' emulator-logcat.txt; then
            echo 'FATAL runtime exception detected for BABEL' >&2
            exit 42
          fi
          echo 'NO_FATAL_RUNTIME_EXCEPTION=PASS' >> emulator-status.txt
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BABEL-Emulator-Diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            babel-ci/project/emulator-avd-create.txt
            babel-ci/project/emulator-avd-list.txt
            babel-ci/project/emulator-boot.txt
            babel-ci/project/emulator-install.txt
            babel-ci/project/emulator-launch.txt
            babel-ci/project/emulator-activity.txt
            babel-ci/project/emulator-activity-babel.txt
            babel-ci/project/emulator-logcat.txt
            babel-ci/project/emulator-status.txt
            babel-ci/project/emulator-home.png
            babel-ci/project/emulator-game-start.png
            babel-ci/project/emulator-gameplay.png
      - name: Package auditable source snapshot
        working-directory: babel-ci/project
        run: zip -qr BABEL-Android-Source.zip . -x '.gradle/*' 'app/build/*' 'apk-inspect/*' '.android/*'
      - uses: actions/upload-artifact@v4
        with:
          name: BABEL-Android-APK
          if-no-files-found: error
          retention-days: 7
          path: |
            babel-ci/project/BABEL-The-Weight-of-Heaven-debug.apk
            babel-ci/project/BABEL-Android-Source.zip
            babel-ci/project/apk-badging.txt
            babel-ci/project/apk-signature.txt
            babel-ci/project/apk-zip-test.txt
            babel-ci/project/apk-sha256.txt
            babel-ci/project/apk-size.txt
            babel-ci/project/compiled-classes.txt
            babel-ci/project/emulator-status.txt
            babel-ci/project/emulator-home.png
            babel-ci/project/emulator-game-start.png
            babel-ci/project/emulator-gameplay.png
