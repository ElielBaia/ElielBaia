name: Build BABEL Android APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'babel-ci/**'
      - '.github/workflows/babel-android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore auditable BABEL source snapshot
        shell: bash
        run: |
          mkdir -p babel-ci
          cat babel-ci/source-parts/part-*.b64 | base64 -d > babel-ci/babel_project_source.zip
          unzip -q babel-ci/babel_project_source.zip -d babel-ci
          test -f babel-ci/project/app/build.gradle

      - name: Generate original textures and sounds
        working-directory: babel-ci/project
        run: python3 tools/generate_assets.py
      - name: Build native Android APK
        working-directory: babel-ci/project
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate installable package structure and signature
        working-directory: babel-ci/project
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK" | tee apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          unzip -t "$APK" | tee apk-zip-test.txt
          sha256sum "$APK" | tee apk-sha256.txt
          cp "$APK" BABEL-The-Weight-of-Heaven-debug.apk
      - name: Package auditable source snapshot
        working-directory: babel-ci/project
        run: zip -qr BABEL-Android-Source.zip . -x '.gradle/*' 'app/build/*'
      - uses: actions/upload-artifact@v4
        with:
          name: BABEL-Android-APK
          if-no-files-found: error
          retention-days: 7
          path: |
            babel-ci/project/BABEL-The-Weight-of-Heaven-debug.apk
            babel-ci/project/BABEL-Android-Source.zip
            babel-ci/project/apk-badging.txt
            babel-ci/project/apk-signature.txt
            babel-ci/project/apk-zip-test.txt
            babel-ci/project/apk-sha256.txt
