name: Runtime Validate BABEL Android

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'babel-ci/**'
      - '.github/workflows/babel-android-runtime-validation.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain and API 28 emulator
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1' 'emulator' 'system-images;android-28;default;x86_64'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Assemble and build BABEL
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=babel-ci/project
          mkdir -p "$PROJECT/app/src/main/java/com/forsetigames/babel"
          cat "$PROJECT"/gameview-parts/*.java.part > "$PROJECT/app/src/main/java/com/forsetigames/babel/GameView.java"
          cd "$PROJECT"
          python3 tools/generate_assets.py
          gradle --no-daemon --no-build-cache --rerun-tasks clean :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$APK"
          cp "$APK" BABEL-The-Weight-of-Heaven.apk
          sha256sum BABEL-The-Weight-of-Heaven.apk | tee runtime-apk-sha256.txt
          stat -c '%s bytes' BABEL-The-Weight-of-Heaven.apk | tee runtime-apk-size.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Install, open and play BABEL in Android
        working-directory: babel-ci/project
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$PWD/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n babel_runtime -k 'system-images;android-28;default;x86_64' -p "$ANDROID_AVD_HOME/babel_runtime.avd" -d pixel_2 --force > runtime-avd.txt 2>&1
          "$ANDROID_HOME/emulator/emulator" -avd babel_runtime -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -camera-back none > runtime-emulator-boot.txt 2>&1 &
          EMU_PID=$!
          trap 'adb emu kill >/dev/null 2>&1 || true; kill "$EMU_PID" >/dev/null 2>&1 || true' EXIT
          BOOT=0
          for i in $(seq 1 120); do
            if adb devices 2>/dev/null | grep -q '^emulator-'; then
              [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = '1' ] && { BOOT=1; break; }
            fi
            kill -0 "$EMU_PID" 2>/dev/null || break
            sleep 2
          done
          [ "$BOOT" = '1' ] || { tail -n 200 runtime-emulator-boot.txt; exit 41; }
          adb shell wm size 1080x1920 || true
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb shell settings put secure immersive_mode_confirmations confirmed || true

          adb install -r BABEL-The-Weight-of-Heaven.apk 2>&1 | tee runtime-install.txt
          grep -Fq 'Success' runtime-install.txt
          adb logcat -c
          adb shell am start -W -n com.forsetigames.babel/.MainActivity 2>&1 | tee runtime-launch.txt
          sleep 4
          PID=$(adb shell pidof com.forsetigames.babel | tr -d '\r')
          test -n "$PID"
          adb exec-out screencap -p > runtime-menu.png

          adb shell input tap 540 700
          sleep 3
          test -n "$(adb shell pidof com.forsetigames.babel | tr -d '\r')"
          adb exec-out screencap -p > runtime-before-drop.png

          adb shell input swipe 540 212 675 212 650
          sleep 5
          test -n "$(adb shell pidof com.forsetigames.babel | tr -d '\r')"
          adb exec-out screencap -p > runtime-after-drop.png
          adb logcat -d > runtime-logcat.txt
          if grep -Fq 'Process: com.forsetigames.babel' runtime-logcat.txt && grep -Fq 'FATAL EXCEPTION' runtime-logcat.txt; then exit 42; fi
          cat > runtime-status.txt <<'EOF'
          EMULATOR_BOOT=PASS
          APK_INSTALL=PASS
          MENU_RENDER=PASS
          GAME_SCREEN=PASS
          BLOCK_DROP=PASS
          PROCESS_SURVIVED_PHYSICS=PASS
          NO_FATAL_EXCEPTION=PASS
          EOF
      - name: Upload final runtime-validated APK
        uses: actions/upload-artifact@v4
        with:
          name: BABEL-Runtime-Validated
          if-no-files-found: error
          retention-days: 7
          path: |
            babel-ci/project/BABEL-The-Weight-of-Heaven.apk
            babel-ci/project/runtime-apk-sha256.txt
            babel-ci/project/runtime-apk-size.txt
            babel-ci/project/runtime-status.txt
            babel-ci/project/runtime-menu.png
            babel-ci/project/runtime-before-drop.png
            babel-ci/project/runtime-after-drop.png
            babel-ci/project/runtime-install.txt
            babel-ci/project/runtime-launch.txt
            babel-ci/project/runtime-logcat.txt
