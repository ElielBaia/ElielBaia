name: Build Pulse 100 Android

on:
  push:
    branches: [main]
    paths:
      - 'pulse100/**'
      - '.github/workflows/build-pulse100.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pulse100/**'
      - '.github/workflows/build-pulse100.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install complete Godot Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "build-tools;36.0.0" \
            "platforms;android-35" \
            "platforms;android-36" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Create debug signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore pulse100/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Forseti Games,C=BR" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Configure Godot editor paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          for SETTINGS in "$HOME/.config/godot/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.6.tres"; do
            cat > "$SETTINGS" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          done

      - name: Export unsigned Godot Android APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          relative_project_path: ./pulse100
          use_preset_export_path: true
          export_debug: true
          presets_to_export: Android
          verbose: true
          cache: true

      - name: Align, sign and verify APK
        shell: bash
        run: |
          mkdir -p pulse100/build
          UNSIGNED="$(find pulse100/build "$HOME/.local/share/godot/builds" -type f -name '*unsigned*.apk' 2>/dev/null | head -n 1)"
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED="$(find pulse100/build "$HOME/.local/share/godot/builds" -type f -name '*.apk' 2>/dev/null | head -n 1)"
          fi
          test -n "$UNSIGNED"
          test -s "$UNSIGNED"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" pulse100/build/Pulse100-aligned.apk
          "$APKSIGNER" sign \
            --ks pulse100/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out pulse100/build/Pulse100-v1.0.0.apk \
            pulse100/build/Pulse100-aligned.apk
          test -s pulse100/build/Pulse100-v1.0.0.apk
          unzip -t pulse100/build/Pulse100-v1.0.0.apk
          "$APKSIGNER" verify --verbose --print-certs pulse100/build/Pulse100-v1.0.0.apk
          ls -lh pulse100/build/Pulse100-v1.0.0.apk

      - name: Generate checksum
        shell: bash
        run: sha256sum pulse100/build/Pulse100-v1.0.0.apk | tee pulse100/build/SHA256SUMS.txt

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulse100-Android-v1.0.0
          path: |
            pulse100/build/Pulse100-v1.0.0.apk
            pulse100/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
