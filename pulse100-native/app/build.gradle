plugins {
    id 'com.android.application'
}

android {
    namespace 'com.forsetigames.pulse100'
    compileSdk 36

    defaultConfig {
        applicationId 'com.forsetigames.pulse100'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '2.0.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}
